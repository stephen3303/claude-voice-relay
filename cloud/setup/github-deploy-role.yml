# One-time: lets GitHub Actions deploy Bridge Cloud with short-lived credentials (no stored AWS keys).
# Only jobs in the repo's aws-deploy environment can assume the role. Only cloud-deploy.yml names that
# environment, and the environment only accepts the main branch (update-deploy-role.ps1 sets that), so
# the Claude workflows and any other branch can't deploy. The role can only hand off to the CDK bootstrap roles
# (which do the actual deploy) and test Bedrock.
AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub OIDC deploy role for Bridge Cloud

Parameters:
  Repo:
    Type: String
    Default: stephen3303/claude-voice-relay
  RepoImmutable:
    Type: String
    Description: The same repo in GitHub's immutable subject format (owner@id/repo@id), which this repo uses
    Default: stephen3303@2897814/claude-voice-relay@1422785947

Resources:
  GitHubOidc:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: BridgeGitHubDeploy
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Federated: !Ref GitHubOidc }
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${RepoImmutable}:environment:aws-deploy
                  - !Sub repo:${Repo}:environment:aws-deploy
      Policies:
        - PolicyName: cdk-deploy-and-bedrock-check
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: UseCdkBootstrapRoles
                Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/cdk-hnb659fds-*
              - Sid: CheckBedrockAccess
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:ListFoundationModels]
                Resource: "*"

Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
