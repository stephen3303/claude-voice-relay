# XcodeGen spec for the parts of the app that don't need the glasses. project.yml includes it and adds
# the Meta Wearables toolkit; generate from project.yml.
name: GlassesRelay
options:
  bundleIdPrefix: com.talktobridge
  deploymentTarget:
    iOS: "17.2"
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    exactVersion: "9.30.2"
targets:
  GlassesRelay:
    type: application
    platform: iOS
    sources: [GlassesRelay]
    dependencies:
      - package: Sentry
        product: Sentry
    info:
      path: GlassesRelay/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)   # a CI build may override it; with the glasses toolkit it must match the Meta app's name
        INAlternativeAppNames:              # Siri still answers to "Bridge" when the home-screen name is longer
          - INAlternativeAppName: Bridge
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)   # CI sets this to the run number
        ITSAppUsesNonExemptEncryption: false          # HTTPS only: exempt, so no export paperwork per upload
        UILaunchScreen:                     # navy, with the icon in the middle (Assets.xcassets)
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        SentryDSN: $(SENTRY_DSN)            # empty unless CI sets it from the SENTRY_DSN secret (ErrorReporting.swift)
        # audio: keeps the conversation alive in your pocket. The flavours add their own modes.
        UIBackgroundModes: [audio]
        NSMicrophoneUsageDescription: Hears you through your headset or phone microphone.
        NSSpeechRecognitionUsageDescription: Turns what you say into text for your Claude agents.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talktobridge.bridge
        SWIFT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        APP_DISPLAY_NAME: Bridge
        SENTRY_DSN: ""
