# XcodeGen spec for the personal (sideloaded) build: base.yml plus the Meta Wearables toolkit for the glasses.
# CI runs `xcodegen generate`. Info.plist keys follow the toolkit's getting-started guide for meta-wearables-dat-ios 1.0.1.
include: [base.yml]
packages:
  MWDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: "1.0.1"
targets:
  GlassesRelay:
    dependencies:
      - package: MWDAT
        product: MWDATCore
      - package: MWDAT
        product: MWDATCamera
    info:
      properties:
        CFBundleURLTypes:                   # Meta AI calls back here after registration (MWDAT.AppLinkURLScheme)
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.talktobridge.bridge
            CFBundleURLSchemes: [glassesrelay]
        MWDAT:
          AppLinkURLScheme: "glassesrelay://"
          MetaAppID: $(META_APP_ID)          # "0" = Developer Mode, no attestation
          ClientToken: $(CLIENT_TOKEN)
          TeamID: $(DEVELOPMENT_TEAM)
          Analytics: { OptOut: true }
          CrashReporting: { OptOut: true }
        # bluetooth/external-accessory: links the toolkit uses (added to base.yml's audio)
        UIBackgroundModes: [bluetooth-central, bluetooth-peripheral, external-accessory]
        UISupportedExternalAccessoryProtocols: [com.meta.ar.wearable]
        NSBluetoothAlwaysUsageDescription: Connects to your Meta glasses.
        NSLocalNetworkUsageDescription: Lets your phone find and connect to your glasses over Wi-Fi.
        NSBonjourServices: [_bonjour._tcp]
        NSMicrophoneUsageDescription: Hears you through your glasses, headset or phone microphone.
        NSCameraUsageDescription: Takes photos with your glasses camera when you ask, for Claude to look at.
    settings:
      base:
        META_APP_ID: "0"
        CLIENT_TOKEN: "0"
