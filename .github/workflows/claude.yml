# Mention @claude in a PR or issue comment to have Claude answer or make a change; it can use the
# subagents in .claude/agents ("@claude ask the security-reviewer to look at auth.mjs").
# Only the repo owner and collaborators can trigger it, since the repo is public, and only on their own
# issues and same-repo PRs, and Claude reads only the owner's comments in the thread: Claude runs code
# here, so it must not act on a stranger's text or code.
# No id-token permission, so nothing here can get an OIDC token for the AWS deploy role.
name: Claude
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude:
    if: >-
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'),
        github.event.comment.author_association || github.event.review.author_association || github.event.issue.author_association) &&
      contains(github.event.comment.body || github.event.review.body || format('{0} {1}', github.event.issue.title, github.event.issue.body), '@claude') &&
      (!github.event.issue || contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check for a Claude credential, and that the PR isn't from a fork
        id: gate
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ (github.event.pull_request || github.event.issue.pull_request) && (github.event.pull_request.number || github.event.issue.number) || '' }}
        run: |
          if [ -z "$API_KEY$OAUTH" ]; then
            echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret yet, so @claude is off. See .github/CICD.md."
            exit 0
          fi
          # The commenter is trusted, but a fork's code (npm ci, cdk synth, tests) must not run next to the secrets.
          if [ -n "$PR" ] && [ "$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository -q .isCrossRepository)" != false ]; then
            echo "::notice::PR $PR comes from a fork, so @claude doesn't run on it."
            exit 0
          fi
          echo "ok=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.gate.outputs.ok
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.gate.outputs.ok
        with:
          node-version: 22
      - uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967 # v1.0.252
        if: steps.gate.outputs.ok
        with:
          github_token: ${{ github.token }}
          # Anyone can comment on a public issue or PR, so Claude sees only the owner's comments and the
          # Claude review's. Add a collaborator's username here if one ever joins.
          include_comments_by_actor: ${{ github.repository_owner }},github-actions[bot]
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 80
            --allowedTools "Task,Bash(node --check:*),Bash(node --test:*),Bash(cd:*),Bash(npm ci:*),Bash(npx cdk synth:*),Bash(git diff:*),Bash(git log:*)"
