# Deploys Bridge Cloud (cloud/infra) with the BridgeGitHubDeploy role: short-lived credentials from
# GitHub's OIDC token, no stored AWS keys. The role only trusts the aws-deploy environment, which only
# this job uses and which only accepts main (cloud/setup/update-deploy-role.ps1).
name: Cloud deploy
on:
  push:
    branches: [main]
    paths: ["cloud/infra/**", "cloud/api/**", "site/**", ".github/workflows/cloud-deploy.yml"]
  workflow_dispatch:

permissions:
  id-token: write   # for the OIDC token
  contents: read

concurrency: cloud-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: aws-deploy
    timeout-minutes: 120   # the first domain deploy waits for the Cloudflare validation record
    defaults:
      run:
        working-directory: cloud/infra
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cloud/infra/package-lock.json

      - name: API tests
        run: node --test ../api/voice.test.mjs ../api/auth.test.mjs ../api/push.test.mjs

      - name: Claude connector tests
        run: node --test ../api/connector.test.mjs

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Check Bedrock access (one tiny Claude call)
        continue-on-error: true
        run: |
          aws bedrock-runtime converse --model-id us.anthropic.claude-haiku-5-5 \
            --messages '[{"role":"user","content":[{"text":"Reply with the word ok."}]}]' \
            --inference-config maxTokens=5 --query 'output.message.content[0].text' --output text

      - run: npm ci

      # Catches template keys CloudFormation would reject before they roll BridgeApi back. ci.yml runs it
      # too, but the deploy doesn't wait for CI.
      - name: Check the templates
        run: npx cdk synth -q && node check-template.mjs

      - name: Deploy the API
        run: npx cdk deploy BridgeApi --require-approval never --outputs-file outputs.json

      # Separate, so the API still ships while AWS has CloudFront blocked pending account verification.
      - name: Deploy the website
        continue-on-error: true
        run: npx cdk deploy BridgeWeb --require-approval never --outputs-file web-outputs.json

      - name: Site address
        run: cat outputs.json web-outputs.json 2>/dev/null || true
