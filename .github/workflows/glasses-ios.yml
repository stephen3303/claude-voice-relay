# Builds the glasses iPhone app on a GitHub-hosted Mac, so no Mac is needed.
# personal: unsigned GlassesRelay.ipa artifact (with "Hey Meta"); sign and install it with Sideloadly.
# appstore: compile check of the App Store flavour (appstore.yml: no Meta glasses toolkit, StoreKit Pro).
#           Shipping it is glasses-appstore.yml.
# public:   compile check of the app as export-public.mjs writes it for the public bridge-relay repo.
name: Glasses iOS build
on:
  push:
    paths: ["glasses/ios/**", ".github/workflows/glasses-ios.yml", "export-public.mjs", "public/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        flavor: [personal, appstore, public]
    defaults:
      run:
        working-directory: glasses/ios
    steps:
      - uses: actions/checkout@v4

      - name: Swap in the public export
        if: matrix.flavor == 'public'
        working-directory: .
        run: |
          node export-public.mjs "$RUNNER_TEMP/public"
          rm -rf glasses/ios
          cp -R "$RUNNER_TEMP/public/glasses/ios" glasses/ios

      - name: Use newest Xcode (toolkit needs 26.4+)
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen xcbeautify
          if [ "${{ matrix.flavor }}" = appstore ]; then xcodegen generate --spec appstore.yml; else xcodegen generate; fi

      # base.yml's settings are merged with each flavour's (arrays append), and a missing background mode or
      # a leftover accessory protocol compiles fine, so check the generated Info.plist itself.
      - name: Check the flavour's Info.plist
        run: |
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" GlassesRelay/Info.plist 2>/dev/null; }
          modes=$(plist UIBackgroundModes); echo "UIBackgroundModes: $modes"
          echo "$modes" | grep -qx ' *audio' || { echo "::error::audio background mode missing"; exit 1; }
          plist SentryDSN >/dev/null || { echo "::error::base.yml properties missing"; exit 1; }
          if [ "${{ matrix.flavor }}" = appstore ]; then
            echo "$modes" | grep -qx ' *voip' || { echo "::error::voip background mode missing"; exit 1; }
            if plist UISupportedExternalAccessoryProtocols || plist MWDAT || echo "$modes" | grep -q external-accessory; then
              echo "::error::the App Store build must not declare the Meta glasses accessory"; exit 1
            fi
          else
            echo "$modes" | grep -qx ' *external-accessory' || { echo "::error::external-accessory background mode missing"; exit 1; }
            plist UISupportedExternalAccessoryProtocols | grep -q com.meta.ar.wearable || { echo "::error::glasses accessory protocol missing"; exit 1; }
          fi

      - name: Build unsigned device app
        run: |
          set -o pipefail
          FLAGS=()
          if [ "${{ matrix.flavor }}" = appstore ]; then FLAGS+=('SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) APP_STORE'); fi
          xcodebuild -project GlassesRelay.xcodeproj -scheme GlassesRelay \
            -sdk iphoneos -configuration Release -derivedDataPath build \
            -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            "${FLAGS[@]}" build | xcbeautify --renderer github-actions

      - name: Package IPA
        if: matrix.flavor == 'personal'
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GlassesRelay.app Payload/
          zip -qry GlassesRelay.ipa Payload

      - uses: actions/upload-artifact@v4
        if: matrix.flavor == 'personal'
        with:
          name: GlassesRelay-ipa
          path: glasses/ios/GlassesRelay.ipa
