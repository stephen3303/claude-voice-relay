# Claude reviews each ready (non-draft) PR with the specialized subagents in .claude/agents and posts the
# findings as PR comments. It skips cleanly until a Claude credential is stored; see .github/CICD.md.
name: Claude review
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets, and their code shouldn't run next to one anyway (manual runs: see "Skip fork PRs").
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check for a Claude credential
        id: auth
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$API_KEY$OAUTH" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::No ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN secret yet, so the Claude review is skipped. See .github/CICD.md."
          fi

      # A manual run can name any PR, including a fork's; its code must not run next to the secrets.
      - name: Skip fork PRs
        id: fork
        if: steps.auth.outputs.ok
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          cross=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json isCrossRepository -q .isCrossRepository)
          if [ "$cross" = false ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "::notice::PR $PR comes from a fork, so the Claude review is skipped."
          fi

      - uses: actions/checkout@v4
        if: steps.fork.outputs.ok
        with:
          fetch-depth: 0
          ref: ${{ inputs.pr && format('refs/pull/{0}/head', inputs.pr) || '' }}

      # Review with main's agents: a PR branched before they existed has none, and a PR shouldn't
      # get to rewrite the instructions of the agents reviewing it.
      - name: Use the subagents from main
        if: steps.fork.outputs.ok
        run: |
          rm -rf .claude/agents
          git checkout origin/main -- .claude/agents

      - uses: actions/setup-node@v4
        if: steps.fork.outputs.ok
        with:
          node-version: 22

      - uses: anthropics/claude-code-action@v1
        if: steps.fork.outputs.ok
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
            The PR branch is checked out in the working directory, with full history; the base is origin/main.

            Review this PR with the subagents in .claude/agents. First run
            `git diff --stat origin/main...HEAD` to see what changed, then launch the relevant subagents in
            parallel with the Task tool, each told to review `git diff origin/main...HEAD`:
            - code-reviewer and test-engineer: always.
            - security-reviewer: if anything outside glasses/ios/ and site/ changed, or a workflow changed.
            - ios-reviewer: if glasses/ changed.
            - release-manager: if cloud/, site/ or .github/workflows/ changed.

            When they finish, drop findings you can't confirm by reading the code yourself, and merge
            duplicates. Then post:
            - one inline comment per confirmed finding with `mcp__github_inline_comment__create_inline_comment`
              (confirmed: true), starting with its severity;
            - one summary comment with `gh pr comment $PR_NUMBER --body-file <file>`: a line per subagent
              (ran / skipped, finding count), the test-engineer's command results, and the release-manager's
              SAFE TO DEPLOY or HOLD with its release notes when it ran.
            If nothing survives, the summary says so in one line. Post only GitHub comments; don't push commits.
          claude_args: |
            --max-turns 60
            --allowedTools "Task,Read,Grep,Glob,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git ls-files:*),Bash(node --check:*),Bash(node --test:*),Bash(cd:*),Bash(npm ci:*),Bash(npx cdk synth:*)"
