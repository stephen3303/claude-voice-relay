# Signs the App Store flavour of Bridge and uploads it to App Store Connect (TestFlight first,
# then submit for review from App Store Connect). Run by hand: Actions > Glasses App Store upload.
#
# Repository secrets it needs (Settings > Secrets and variables > Actions):
#   ASC_KEY_ID, ASC_ISSUER_ID   App Store Connect API key (Users and Access > Integrations), role Admin (cloud signing makes the
#                               distribution certificate, which an App Manager key can't)
#   ASC_KEY_P8_BASE64           that key's .p8 file, base64-encoded
#   APPLE_TEAM_ID               paid Apple Developer Program team ID
#   META_APP_ID, META_CLIENT_TOKEN   from the app in the Wearables Developer Center; while they're
#                               unset the build uses "0" (Meta Developer Mode, fine for TestFlight)
# Optional, for crash reports (glasses/setup-sentry-secrets.ps1):
#   SENTRY_DSN, SENTRY_AUTH_TOKEN secrets; SENTRY_ORG, SENTRY_PROJECT variables
# The home-screen name is "Talk to Bridge": "Bridge" is another developer's app on the App Store (ITMS-90129).
name: Glasses App Store upload
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: glasses/ios
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Generate Xcode project
        run: |
          brew install xcodegen xcbeautify
          xcodegen generate

      - name: Install API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"

      - name: Archive (signed by Xcode with the API key)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_CLIENT_TOKEN: ${{ secrets.META_CLIENT_TOKEN }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          set -o pipefail
          xcodebuild -project GlassesRelay.xcodeproj -scheme GlassesRelay -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Bridge.xcarchive" \
            -skipPackagePluginValidation -skipMacroValidation \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM" CODE_SIGN_STYLE=Automatic CODE_SIGN_ENTITLEMENTS=AppStore.entitlements \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            'APP_DISPLAY_NAME=Talk to Bridge' \
            META_APP_ID="${META_APP_ID:-0}" CLIENT_TOKEN="${META_CLIENT_TOKEN:-0}" SENTRY_DSN="$SENTRY_DSN" \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) APP_STORE' \
            archive | xcbeautify --renderer github-actions

      - name: Export and upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Bridge.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      # The App Store Connect key is gone before any npm package runs.
      - name: Remove API key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

      # Symbols, so crash reports show function names and lines. Skipped without the token; never blocks the upload.
      - name: Upload symbols to Sentry
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ]; then echo "No SENTRY_AUTH_TOKEN secret; skipping."; exit 0; fi
          npx --yes @sentry/cli@2.58.6 debug-files upload --include-sources "$RUNNER_TEMP/Bridge.xcarchive/dSYMs"
